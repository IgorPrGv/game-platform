include classpath("application.conf")

# Endereço que aparece nas URLs das filas: http://localhost:9324/000000000000/<fila>
node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

aws {
  region = us-east-1
  accountId = 000000000000
}

# Mesmas regras da AWS: 3 recebimentos e DLQ, visibilidade de 60 s.
queues {
  moderation-results {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "moderation-results-dlq"
      maxReceiveCount = 3
    }
  }
  moderation-results-dlq {}
  media-processing-dlq {}
}
